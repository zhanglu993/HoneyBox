name: HoneyBox CI

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'assets/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Analyze & Test ───────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # ─── Job 2: Build Android APK ────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [analyze]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (debug)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/HoneyBox-debug.apk

      - name: Build Android APK (release)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/HoneyBox.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeybox-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  # ─── Job 3: Windows Build ────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [analyze]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeybox-windows-release
          path: build/windows/x64/runner/Release/
          retention-days: 7

  # ─── Job 4: Code Format Check ────────────────────────────────────
  lint:
    name: Dart Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Check CI policies
        shell: pwsh
        run: |
          ./test/ci/flutter_ci_workflow_test.ps1
          ./test/ci/android_repository_order_test.ps1

  # ─── Job 5: Publish Release ───────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-android, build-windows, lint]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: honeybox-android-apk
          path: release-artifacts/

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: honeybox-windows-release
          path: release-artifacts/windows/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "HoneyBox ${{ github.ref_name }}"
          body: |
            ## HoneyBox ${{ github.ref_name }}

            Built from commit ${{ github.sha }}

            ### Downloads
            - **Android release APK** - `honeybox-android-apk`
            - **Windows x64** - `honeybox-windows-release`
          files: |
            release-artifacts/**
          prerelease: false
          generate_release_notes: true

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          apk="$(find release-artifacts -name 'HoneyBox.apk' -type f | head -n1)"
          if [ -z "$apk" ]; then
            echo "HoneyBox.apk not found under release-artifacts" >&2
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Push tag and code to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          git push --force "https://oauth2:${GITEE_TOKEN}@gitee.com/realmcu/HoneyBox.git" \
            "HEAD:refs/heads/master" "${GITHUB_REF_NAME}"

      - name: Publish Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.ref_name }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          body="HoneyBox ${TAG}"$'\n\n'"SHA-256: ${SHA256}"
          rid="$(curl -fsS -X POST \
            "https://gitee.com/api/v5/repos/realmcu/HoneyBox/releases" \
            --data-urlencode "access_token=${GITEE_TOKEN}" \
            --data-urlencode "tag_name=${TAG}" \
            --data-urlencode "name=HoneyBox ${TAG}" \
            --data-urlencode "body=${body}" \
            -d "target_commitish=master" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')"
          if ! curl -fsS -X POST \
            "https://gitee.com/api/v5/repos/realmcu/HoneyBox/releases/${rid}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${APK}"; then
            echo "attach_files failed; rolling back release ${rid}" >&2
            curl -fsS -X DELETE \
              "https://gitee.com/api/v5/repos/realmcu/HoneyBox/releases/${rid}?access_token=${GITEE_TOKEN}" \
              || echo "rollback delete also failed; delete release ${rid} manually" >&2
            exit 1
          fi
